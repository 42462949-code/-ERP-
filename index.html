rows=rows.concat(created[current]||[]);return {h,rows}}
let lastData;function list(){lastData=dataset();let data=lastData;let filtered=data.rows.filter(r=>(!query||r.join(' ').toLowerCase().includes(query.toLowerCase()))&&(!status||r.includes(status))&&(tab==='全部'||r.includes(tab)));let shown=filtered.map(r=>r.map((c,i)=>i===r.length-1&&['状态','核算状态'].includes(data.h[i])?badge(c):esc(c)));let sub=currentModule==='engineering'?'统一工程主数据，维护物品、BOM 与工艺版本。':currentModule==='warehouse'?'按公司、仓库及货主分别查询，客户料与自有料独立记录。':currentModule==='entrust'?'客户供料与自有补料分开追溯，补料结算方式待确认。':`当前列表为结构与交互演示`;return title(current,sub)+`<section class="panel"><div class="tabs">${['全部','待审核','已审核','草稿'].map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div><form class="filters" id="filterForm"><div class="field"><label>关键词</label><input id="filterQuery" placeholder="编号 / 名称 / 业务对象" value="${esc(query)}"></div><div class="field"><label>状态</label><select id="filterStatus"><option value="">全部状态</option>${['待审核','已审核','草稿','已启用','执行中','待确认'].map(s=>`<option ${status===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn primary" type="submit">查询</button><button class="btn" type="button" id="clearFilter">重置</button></form><div class="tabletoolbar"><span>共 <b>${filtered.length}</b> 条记录 <span class="count-label">示例数据</span></span><button class="link" id="export">导出当前列表 ↓</button></div>${shown.length?simpleTable(data.h,shown):'<div class="empty">没有符合条件的记录，请调整筛选条件。</div>'}<div class="pagination"><span>点击任意一行查看明细及单据流转</span><div class="pages">每页 20 条 <button disabled>‹</button><button class="selected">1</button><button disabled>›</button></div></div></section>${current==='MRP 物料需求计算'?'<div class="alert" style="margin-top:18px">MRP 页面当前仅演示计划结果结构；尚未连接库存、BOM 或真实计算引擎。备货抵扣请进入销售管理查看交互示例。</div>':''}<div class="foot">原型中的单据操作仅在当前页面会话生效，不保存到服务器 · 刷新即恢复示例</div>`}
function allocation(){return title('客户备货与抵扣','正式订单承接备货需求，保留来源关联，避免重复排产。',false)+`<div class="alert">示例：客户备货 100 件，正式销售订单 60 件。确认抵扣后，正式需求 60 件 + 剩余备货 40 件 = 有效需求 100 件。匹配与审批细则待业务确认。</div><section class="panel"><div class="panel-head"><h2>需求关联 · 电摩车架 A 型</h2>${badge(allocated?'已生效':'待确认')}</div><div class="allocation"><div class="allocation-grid"><div class="alloc-metric">原始备货需求<b>100 <small>件</small></b></div><div class="alloc-metric">已关联抵扣<b>${allocated} <small>件</small></b></div><div class="alloc-metric">剩余备货需求<b>${100-allocated} <small>件</small></b></div></div><div class="inline-form"><div class="field"><label>客户 / 备货来源</label><input value="示例客户 A · BO-001" readonly></div><div class="field"><label>正式销售订单</label><input value="SO-202610-001 · 60件" readonly></div><div class="field"><label>本次抵扣数量（件）</label><input id="allocQty" type="number" value="60" min="1" max="60" step="1"></div><button class="btn primary" id="confirmAlloc">确认抵扣（演示）</button></div><div class="alloc-flow"><div class="alloc-block">正式销售需求<strong>60 件</strong>SO-202610-001</div><span>＋</span><div class="alloc-block">剩余备货需求<strong>${100-allocated} 件</strong>BO-001</div><span>＝</span><div class="alloc-block result">有效需求<strong>${160-allocated} 件</strong>${allocated===60?'已消除重复需求':'尚有未关联需求'}</div></div><div class="alert">已安排生产示例：100 件。抵扣只重新关联需求来源，不重复生成工单。重复确认、超过正式订单余量或备货可用量会被拦截。</div><h3 style="font-size:13px;margin:25px 0 15px">抵扣关联记录</h3>${allocated?simpleTable(['备货来源','正式订单','累计抵扣','单位','状态'],[['BO-001','SO-202610-001',allocated,'件',badge('已生效')]]):'<div class="empty" style="border:1px dashed #dae3f1;border-radius:6px;padding:25px">尚未建立关联，请确认一次抵扣。</div>'}</div></section><div class="foot">此为数量关联演示，不是金额冲销 · 不连接真实订单与 MRP</div>`}
function render(){$('#content').innerHTML=current==='home'?home():current==='客户备货与抵扣'?allocation():list();bind()}
function bind(){$('#resetDemo')?.addEventListener('click',()=>{allocated=0;created={};render();notify('演示已重置，未操作任何服务器数据')});$('#content').querySelectorAll('[data-dest]').forEach(b=>b.onclick=()=>go(b.dataset.dest,b.dataset.mod));$('#newDoc')?.addEventListener('click',newDoc);$('#filterForm')?.addEventListener('submit',e=>{e.preventDefault();query=$('#filterQuery').value.trim();status=$('#filterStatus').value;render()});$('#clearFilter')?.addEventListener('click',()=>{query='';status='';tab='全部';render()});$('#content').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#content').querySelectorAll('[data-row]').forEach(r=>r.onclick=()=>{if(r.dataset.home){go('工单明细','manufacture');return}let d=dataset();let filtered=d.rows.filter(r=>(!query||r.join(' ').toLowerCase().includes(query.toLowerCase()))&&(!status||r.includes(status))&&(tab==='全部'||r.includes(tab)));openDetail(d.h,filtered[+r.dataset.row])});$('#confirmAlloc')?.addEventListener('click',()=>{let n=Number($('#allocQty').value);if(!Number.isInteger(n)||n<=0)return notify('请输入大于 0 的整数件数');if(allocated>=60)return notify('该正式订单已全部关联，不能重复抵扣');if(n>60-allocated||n>100-allocated)return notify('抵扣超额：不能超过正式订单未关联量或备货可用量');allocated+=n;render();notify(`已演示关联 ${n} 件，未生成重复工单`)});$('#export')?.addEventListener('click',exportCSV)}
function openDrawer(title,body,foot){$('#drawerTitle').textContent=title;$('#drawerBody').innerHTML=body;$('#drawerFoot').innerHTML=foot||'<button class="btn" onclick="closeDrawer()">关闭</button>';$('#overlay').classList.add('open');$('#drawer').classList.add('open');$('#closeDrawer').focus()}function closeDrawer(){$('#overlay').classList.remove('open');$('#drawer').classList.remove('open')}window.closeDrawer=closeDrawer;
function openDetail(h,row){if(!row)return;let body=`<span class="badge">示例单据详情</span><h3 style="font-size:22px;margin:18px 0">${esc(row[0])}</h3>${h.map((k,i)=>`<div class="detail-row"><span>${esc(k)}</span><span>${esc(row[i])}</span></div>`).join('')}<div class="detail-row"><span>业务公司</span><span>${esc(demoCompany)}</span></div><h3 style="font-size:14px;margin-top:27px">来源与下游</h3><div class="timeline"><div>来源单据 / 来源行<small>演示关联，真实来源以业务单据为准</small></div><div>当前单据<small>${esc(current)} · ${esc(row[0])}</small></div><div>下游单据<small>领料、入库、出货等需按业务权限生成</small></div></div><div class="drawer-note">当前仅为界面原型。审批、库存过账、单据下推及并发校验尚未连接后端。</div>`;if(current==='BOM 表')body+=`<h3>子件示例</h3>${simpleTable(['子件','用量','单位'],[['冲压侧板','2','件'],['焊接横梁','1','件'],['焊接辅料','0.15','kg']])}`;openDrawer('查看详情',body,`<button class="btn" onclick="closeDrawer()">关闭</button><button class="btn primary" id="pushDoc">下推单据</button>`);$('#pushDoc').onclick=()=>{notify('下推界面演示：尚未连接业务后端，不会生成真实单据');$('#drawerBody').insertAdjacentHTML('beforeend','<div class="drawer-note">可选下游将依单据类型配置：领料单、入库单、出货单。来源行与剩余可下推数量须由后端校验。</div>')}}
function newDoc(){drawerMode='new';openDrawer(`新增${current==='物品资料'?'物品':current}`,`<div class="alert">填写后仅新增到当前页面的示例列表，刷新即恢复。</div><form id="newForm"><div class="formfield"><label>编号 *</label><input name="code" required maxlength="40" value="DEMO-${Date.now().toString().slice(-6)}"></div><div class="formfield"><label>业务对象 / 名称 *</label><input name="name" required maxlength="60" placeholder="请输入名称"></div><div class="formfield"><label>摘要 / 规格 *</label><input name="summary" required maxlength="100" placeholder="请输入示例业务内容"></div><div class="formfield"><label>数量 *</label><input name="qty" type="number" required min="0.001" step="0.001" value="10"></div><div class="formfield"><label>单位</label><select name="unit"><option>件</option><option>kg</option><option>米</option></select></div></form><div class="drawer-note">这里用于预览录入流程。税价、仓库、货主、来源行等正式字段将按各单据分别设计。</div>`,`<button class="btn" onclick="closeDrawer()">取消</button><button class="btn primary" id="saveDraft">保存演示草稿</button>`);$('#saveDraft').onclick=()=>{let f=$('#newForm');if(!f.reportValidity())return;let v=new FormData(f),h=dataset().h;let r=h.map((k,i)=>i===0?v.get('code'):k.includes('状态')?'草稿':k.includes('单位')?v.get('unit'):k.includes('数量')?v.get('qty'):k.includes('日期')?'2026-10-17':k.includes('版本')?'V1.0':k.includes('公司')?demoCompany:k.includes('工厂')?demoFactory:i===1?v.get('name'):v.get('summary'));(created[current]??=[]).push(r);closeDrawer();tab='全部';query='';status='';render();notify('演示草稿已加入本页，未保存至服务器')}}
function exportCSV(){let d=dataset(),rs=d.rows.filter(r=>(!query||r.join(' ').toLowerCase().includes(query.toLowerCase()))&&(!status||r.includes(status))&&(tab==='全部'||r.includes(tab)));let csv='\ufeff'+[d.h,...rs].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=current+'-演示.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);notify('已导出当前筛选的示例列表')}
$('#mobileClose').onclick=()=>$('.sidebar').classList.remove('mobile-expanded');
$('#brandicon').innerHTML=icon('manufacture');
$('#overlay').onclick=closeDrawer;$('#closeDrawer').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
renderNav();render();
</script></body></html>
